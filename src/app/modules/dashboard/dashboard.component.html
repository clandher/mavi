<div class="dashboard-container">
    <header class="dashboard-header">
        <div class="header-left">
            <nav class="main-nav">
                <ul>
                    <li><a routerLink="/app/actividades" routerLinkActive="active">Actividades</a></li>
                    <li><a routerLink="/app/estudiantes" routerLinkActive="active">Estudiantes</a></li>
                    <li><a routerLink="/app/configuración" routerLinkActive="active">Configuración</a></li>
                </ul>
            </nav>
        </div>

        <div class="user-menu" *ngIf="authService.currentUser">
            <div class="school-info" (click)="toggleMenu()">
                <img class="school-logo" [src]="schoolService.school.logoUrl" alt="Logo"
                    *ngIf="schoolService.school.logoUrl">
                <span class="school-description">{{ schoolService.school.description }}</span>
                <span class="menu-icon">▼</span>
            </div>


            <div class="menu-dropdown" [class.show]="menuOpen">
                <div class="menu-item" (click)="logout()">
                    <span class="menu-icon">🚪</span>
                    <span>Cerrar sesión</span>
                </div>
            </div>
        </div>
    </header>
    <br>
    <main class="dashboard-content">
        <router-outlet></router-outlet>
    </main>
</div>
