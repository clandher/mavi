<!-- dashboard.component.html -->
<div class="dashboard-container">
    <!-- Header with user menu -->
    <header class="dashboard-header">
        <h1>Dashboard</h1>

        <div class="user-menu" *ngIf="authService.currentUser">
            <button class="user-menu-toggle" (click)="toggleMenu()">
                <span class="user-avatar">{{ getInitials(authService.currentUser.name) }}</span>
                <span class="user-name">{{ authService.currentUser.name }}</span>
                <span class="menu-icon">▼</span>
            </button>

            <div class="menu-dropdown" [class.show]="menuOpen">
                <div class="menu-item" (click)="logout()">
                    <span class="menu-icon">🚪</span>
                    <span>Cerrar sesión</span>
                </div>
            </div>
        </div>
    </header>
