<div class="dashboard-container">
    <header class="dashboard-header">
        <div class="header-left">
            <nav class="main-nav">
                <ul>
                    <li><a routerLink="/app/actividades" routerLinkActive="active">Actividades</a></li>
                    <li><a routerLink="/app/estudiantes" routerLinkActive="active">Estudiantes</a></li>
                    <li><a routerLink="/app/desarrollo" routerLinkActive="active">Desarrollo</a></li>
                </ul>
            </nav>
        </div>

        <div class="user-menu" *ngIf="authService.currentUser">
            <button class="user-menu-toggle" (click)="toggleMenu()">
                <span class="user-avatar">{{ getInitials(authService.currentUser.name) }}</span>
                <span class="user-name">{{ authService.currentUser.name }}</span>
                <span class="menu-icon">▼</span>
            </button>

          
            <div class="menu-dropdown" [class.show]="menuOpen">
                <div class="menu-item" (click)="logout()">
                    <span class="menu-icon">🚪</span>
                    <span>Cerrar sesión</span>
                </div>
            </div>
        </div>
    </header>
    
    <main class="dashboard-content">
        <router-outlet></router-outlet>
    </main>
</div>
