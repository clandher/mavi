<div class="dashboard-container">
    <header class="dashboard-header">

        <img class="logo" [src]="logoUrl" alt="Logo" *ngIf="logoUrl">

        <div class="header-left">
            <nav class="main-nav">
                <ul>
                    <li><a routerLink="/app/actividades" routerLinkActive="active">Actividades</a></li>
                    <li><a routerLink="/app/estudiantes" routerLinkActive="active">Estudiantes</a></li>
                    <li><a routerLink="/app/configuración" routerLinkActive="active">Configuración</a></li>
                </ul>
            </nav>
        </div>

        <div class="user-menu" *ngIf="authService.user">
            <button class="user-menu-toggle" (click)="toggleMenu()">
                <span class="user-avatar">{{ getInitials(authService.user.name) }}</span>
                <span class="user-name">{{ authService.user.name }}</span>
                <span class="menu-icon">▼</span>
            </button>

            <div class="menu-dropdown" [class.show]="menuOpen">
                <div class="menu-item" (click)="logout()">
                    <span class="menu-icon">🚪</span>
                    <span>Cerrar sesión</span>
                </div>
            </div>
        </div>
    </header>
    <br>
    <main class="dashboard-content">
        <router-outlet></router-outlet>
    </main>
</div>
