<form [formGroup]="form">
    <div class="row g-3">
        <app-form-group class="col-12 col-md-6" title="Fecha de nacimiento" [control]="form.get('birthdate')"
            name="birthdate" required type="date">
            <input id="birthdate" type="date" class="form-control" formControlName="birthdate">
        </app-form-group>
        <app-form-group class="col-12 col-md-6" title="CURP" [control]="form.get('curp')" name="curp"
            placeholder="CURP">
            <input id="curp" type="text" class="form-control text-uppercase" formControlName="curp" placeholder="CURP">
        </app-form-group>
        <app-form-group class="col-12 col-md-6" title="Teléfono" [control]="form.get('phone')" name="phone"
            placeholder="Teléfono">
            <input id="phone" type="text" class="form-control" formControlName="phone" placeholder="Teléfono">
        </app-form-group>
        <app-form-group class="col-12 col-md-6" title="Lugar de nacimiento" [control]="form.get('placeOfBirth')"
            name="placeOfBirth" placeholder="Lugar de nacimiento">
            <input id="placeOfBirth" type="text" class="form-control" formControlName="placeOfBirth"
                placeholder="Lugar de nacimiento">
        </app-form-group>
        <app-form-group class="flex-grow-1" title="Apodo" [control]="form.get('nick')" name="nick" placeholder="Apodo">
            <input id="nick" type="text" class="form-control" formControlName="nick" placeholder="Apodo">
        </app-form-group>
    </div>
</form>

<app-submit [form]="form" [submit]="submit.bind(this)" [isModal]="false">
</app-submit>
