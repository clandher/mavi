<div class="flex flex-col gap-4 text-white">
	<div *ngFor="let obs of timeObservations">

		<textarea class="form-control" rows="2" [(ngModel)]="obs.observation" name="observation{{obs.id}}"></textarea>
		<div class="flex justify-between mb-2">
			<div class=" text-gray-500">
				<small class="hover-link" [routerLink]="['/app/actividades']"
					[queryParams]="{ category: obs.activity.categoryId, activity: obs.activity.id }">
					{{ obs.activity.description }}
					-
					{{ obs.createdAt | date:'mediumDate' }}
				</small>
			</div>

			<div class="flex gap-2 mt-2 justify-end">
				<button type="button" class="btn btn-outline btn-sm" (click)="deleteObservation(obs)">
					<i class="fa fa-trash"></i> Eliminar
				</button>
				<button type="button" class="btn btn-primary btn-sm" (click)="saveObservation(obs)">
					<i class="fa fa-save"></i> Guardar
				</button>
			</div>
		</div>
	</div>
</div>

@if(timeObservations.length === 0){
<div class="text-gray-500 text-center py-8">
	No hay observaciones registradas.
</div>

<div class="flex justify-center py-4">
	<button class="btn btn-secondary" (click)="showObservations = true">
		<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
			class="size-4 me-2">
			<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
		</svg>
		Agregar observación
	</button>
</div>

} @else {
<div class="mavi-bottom-actions">
	<div class="mavi-bottom-actions-inner">
		<button type="button" class="btn btn-secondary" (click)="showObservations = true">
			<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
				stroke="currentColor" class="size-4 me-2">
				<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
			</svg>
			Agregar observación
		</button>
	</div>
</div>
}
<app-observations *ngIf="showObservations" [studentId]="studentId!" (complete)="onObservationsComplete($event)">
</app-observations>
