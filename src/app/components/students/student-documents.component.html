<div class="bg-white shadow-lg p-6">
  <div (click)="fileInput.click()"
    class="border-1 border-dashed p-6 flex flex-col items-center justify-center cursor-pointer transition hover:bg-blue-50"
    (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
    [class.bg-blue-100]="dragging" style="min-height: 220px; min-width: 340px;">
    <span class="text-gray-600 mb-3 font-semibold flex items-center gap-2">
      Arrastra aquí los documentos o haz clic para subir
    </span>
    <input type="file" multiple hidden #fileInput (change)="onFileSelect($event)">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full mt-4">
      <div *ngFor="let document of documents; let i = index"
        class="relative flex flex-col items-center bg-gradient-to-br from-white to-blue-50 border border-blue-200  shadow-md hover:shadow-xl transition group p-4"
        draggable="true" (dragstart)="onDocDragStart(i)">
        <div class="w-12 h-14 flex items-center justify-center mb-2">
          <ng-container *ngIf="isImage(document); else fileIcon">
            <img [src]="document.previewUrl" alt="preview" class="w-10 h-12 object-contain rounded shadow" />
          </ng-container>
          <ng-template #fileIcon>
            <svg class="w-10 h-12" viewBox="0 0 48 48">
              <rect x="8" y="6" width="32" height="36" rx="4" fill="#eaf0fb" stroke="#90cdf4" stroke-width="2" />
              <rect x="8" y="6" width="32" height="10" rx="2" fill="#4299e1" />
              <rect x="14" y="20" width="20" height="2.5" rx="1.25" fill="#a0aec0" />
              <rect x="14" y="26" width="20" height="2.5" rx="1.25" fill="#a0aec0" />
              <rect x="14" y="32" width="12" height="2.5" rx="1.25" fill="#a0aec0" />
            </svg>
          </ng-template>
        </div>
        <div (click)="downloadDocument($event, document)"
          class="font-semibold text-xs text-center truncate max-w-[110px] text-gray-700" title="{{ document.name }}">
          {{ document.name }}
        </div>
        <button
          class="absolute top-2 right-2 bg-white border border-gray-300 rounded-full p-1 text-red-500 shadow hover:bg-red-100 transition"
          (click)="removeDocument(i,$event)" title="Eliminar">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" />
            <line x1="6" y1="18" x2="18" y2="6" stroke="currentColor" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
