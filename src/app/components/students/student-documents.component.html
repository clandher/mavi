<div (click)="fileInput.click()" class="document-section d-flex flex-column cursor-pointer transition"
	(drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)"
	[class.bg-primary-subtle]="dragging">

	<input type="file" multiple hidden #fileInput (change)="onFileSelect($event)">
	<div class="row ">

		<div *ngFor="let document of documents; let i = index" class="col-3 " draggable="true"
			(click)="downloadDocument($event, document)">

			<div
				class="gx-3 document-file position-relative d-flex flex-column align-items-center border shadow-sm transition group p-2">


				<div class="d-flex align-items-center justify-content-center mb-2" style="width: 48px; height: 56px;">
					<ng-container *ngIf="isImage(document) && document.previewUrl; else fileIcon">
						<img [src]="document.previewUrl" alt="preview" class="img-fluid rounded shadow"
							style="width: 40px; height: 48px; object-fit: contain;" />
					</ng-container>
					<ng-template #fileIcon>
						<svg class="img-fluid" style="width: 40px; height: 48px;" viewBox="0 0 48 48">
							<rect x="8" y="6" width="32" height="36" rx="4" fill="#eaf0fb" stroke="#90cdf4"
								stroke-width="2" />
							<rect x="8" y="6" width="32" height="10" rx="2" fill="#4299e1" />
							<rect x="14" y="20" width="20" height="2.5" rx="1.25" fill="#a0aec0" />
							<rect x="14" y="26" width="20" height="2.5" rx="1.25" fill="#a0aec0" />
							<rect x="14" y="32" width="12" height="2.5" rx="1.25" fill="#a0aec0" />
						</svg>
					</ng-template>
				</div>
				<div (click)="downloadDocument($event, document)"
					class="text-decoration-underline fw-semibold text-center text-truncate" style="max-width: 110px;"
					title="{{ document.name }}">
					{{ document.name }}
				</div>
				<button
					class="btn-close position-absolute top-0 end-0 bg-white border border-secondary rounded-circle p-1 text-danger shadow-sm"
					(click)="removeDocument(i,$event)" title="Eliminar">
					<!-- <svg class="img-fluid" style="width: 16px; height: 16px;" fill="none" stroke="currentColor"
					stroke-width="2" viewBox="0 0 24 24">
					<line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" />
					<line x1="6" y1="18" x2="18" y2="6" stroke="currentColor" />
				</svg> -->
				</button>
			</div>


		</div>
	</div>
	<span class="text-secondary mt-3 fw-semibold d-flex justify-content-center gap-2">
		Arrastra aquí los documentos o haz clic para subirlos
		<span *ngIf="documents.length > 0"> más </span>
	</span>
</div>
