<div class="bg-white shadow p-6">
    <form (ngSubmit)="saveStudent()" class="flex gap-1 items-center ">
        <label for="photo" class="photo-label">
            <img *ngIf="student.photo; else placeholder" [src]="student.photo" class="student-photo" alt="Foto">
            <ng-template #placeholder>
                <div class="photo-placeholder">+</div>
            </ng-template>
            <input id="photo" type="file" accept="image/*" (change)="onPhotoSelected($event)" hidden>
        </label>
        <input id="name" type="text" class="form-control" [(ngModel)]="student.name" name="name" required
            placeholder="Nombre">
        <input id="birthdate" type="date" class="form-control" [(ngModel)]="student.birthdate" name="birthdate"
            required>

        <button type="submit" class="btn btn-save" [disabled]="isSaving">
            <span *ngIf="!isSaving">Guardar</span>
            <span *ngIf="isSaving">Guardando...</span>
        </button>
    </form>
</div>

@if (student.id !== 0){
<div class="bg-black flex">
    <a routerLink="info" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-white border-b-4"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 -mb-px border-b-2 focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Información General
    </a>
    <a routerLink="activities" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-white border-b-4"
        class="px-4 py-2 -mb-px border-b-2focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Actividades
    </a>
    <a routerLink="payments" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-white border-b-4"
        class="px-4 py-2 -mb-px border-b-2 focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Pagos
    </a>
    <a routerLink="technical-sheet" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-white border-b-4"
        class="px-4 py-2 -mb-px border-b-2 focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Ficha técnica
    </a>
</div>

<router-outlet></router-outlet>
}
