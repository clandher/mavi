<div class="bg-white shadow p-6">
    <button routerLink="/app/students" class="btn btn-back">← Volver</button>
    <br>
    <br>

    <form (ngSubmit)="saveStudent()" class="mavi-form horizontal-form">
        <label for="photo" class="photo-label">
            <img *ngIf="student.photo; else placeholder" [src]="student.photo" class="student-photo" alt="Foto">
            <ng-template #placeholder>
                <div class="photo-placeholder">+</div>
            </ng-template>
            <input id="photo" type="file" accept="image/*" (change)="onPhotoSelected($event)" hidden>
        </label>
        <input id="name" type="text" [(ngModel)]="student.name" name="name" required placeholder="Nombre">
        <input id="birthdate" type="date" [(ngModel)]="student.birthdate" name="birthdate" required>

        <div class="form-actions">
            <button type="submit" class="btn btn-save" [disabled]="isSaving">
                <span *ngIf="!isSaving">Guardar</span>
                <span *ngIf="isSaving">Guardando...</span>
            </button>
        </div>
    </form>
</div>

<br>
@if (student.id !== 0){
<div class="bg-black flex">
    <a routerLink="info" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-blue-50 border-b-4"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-4 py-2 -mb-px border-b-2 focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Información General
    </a>
    <a routerLink="activities" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-blue-50 border-b-4"
        class="px-4 py-2 -mb-px border-b-2focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Actividades
    </a>
    <a routerLink="payments" routerLinkActive="border-blue-500 text-blue-600 font-semibold bg-blue-50 border-b-4"
        class="px-4 py-2 -mb-px border-b-2 focus:outline-none border-transparent text-gray-500 flex-1 text-center">
        Pagos
    </a>
</div>

<br>

<router-outlet></router-outlet>
}
