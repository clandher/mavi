<div class="mavi-tabs">
    <button class="mavi-tab" (click)="selectedSchoolTab='schools'"
        [ngClass]="{'selected': selectedSchoolTab === 'schools'}">
        Escuela
    </button>
    @if (authService.user?.developer) {
    <button class="mavi-tab" (click)="selectedSchoolTab='development'"
        [ngClass]="{'selected': selectedSchoolTab === 'development'}">
        Desarrollo
    </button>
    }
    <button class="mavi-tab" (click)="selectedSchoolTab='categories'"
        [ngClass]="{'selected': selectedSchoolTab === 'categories'}">
        Categorías
    </button>
</div>
<br>
<div [ngSwitch]="selectedSchoolTab" class="mavi-border">
    <div *ngSwitchCase="'development'" class="schools-list">
        <!-- <app-submit [form]="restartForm" [submit]="onRestart.bind(this)" submitText="Reiniciar">
        </app-submit> -->
        <btn-loading [action]="onRestart.bind(this)" text="Reiniciar" />
    </div>
    <div *ngSwitchCase="'schools'">
        <div *ngFor="let school of schools" class="school-card">
            <div class="school-header">
                <label for="logo{{school.id}}" class="logo-label">
                    <img *ngIf="school.logoUrl; else logoPlaceholder" [src]="school.logoUrl" class="school-logo-large"
                        alt="Logo">
                    <ng-template #logoPlaceholder>
                        <div class="logo-placeholder-large">+</div>
                    </ng-template>
                    <input id="logo{{school.id}}" type="file" accept="image/*" (change)="onLogoSelected($event, school)"
                        hidden>
                </label>
                <div class="school-name">
                    <textarea class="form-control school-name-input" rows="2" [(ngModel)]="school.description"
                        name="school{{school.description}}"></textarea>
                </div>
            </div>
            <div class="school-actions">
                <button type="button" class="btn btn-primary btn-sm" (click)="saveSchool(school)">
                    <i class="fa fa-save"></i> Guardar
                </button>
            </div>
        </div>
    </div>
    <div *ngSwitchCase="'categories'" [formGroup]="categoryForm">
        <app-form-group title="Nueva categoría" [control]="categoryForm.get('newCategory')">
            <input type="text" formControlName="newCategory" placeholder="Nueva categoría" class="form-control" />
        </app-form-group>

        <div class="flex gap-2 justify-end">
            <button class="btn btn-primary" (click)="addCategory()">Agregar</button>
        </div>

        <ul class="category-list" formArrayName="categories">
            <li *ngFor="let category of categoriesControls; let i = index" [formGroupName]="i"
                class="flex gap-2 mb-2 items-center">
                <label class="text-white">{{ category.value.type }}</label>
                <button class="btn btn-destructive" (click)="deleteCategory(category.value.id, i)">Eliminar</button>
            </li>
        </ul>
    </div>
</div>

<style>
    .schools-list {
        display: flex;
        flex-direction: column;
        gap: 32px;
        color: #fff;
    }

    .school-card {
        background: rgba(0, 0, 0, 0.15);
        border-radius: 16px;
        padding: 24px 16px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .school-header {
        display: flex;
        align-items: center;
        gap: 32px;
    }

    .logo-label {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
    }

    .school-logo-large {
        width: 96px;
        height: 96px;
        border-radius: 16px;
        object-fit: cover;
        background: #eee;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        transition: box-shadow 0.2s;
    }

    .school-logo-large:hover {
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
    }

    .logo-placeholder-large {
        width: 96px;
        height: 96px;
        border-radius: 16px;
        background: #eee;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3em;
        color: #bbb;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
    }

    .school-name {
        flex: 1;
        display: flex;
        align-items: center;
    }

    .school-name-input {
        font-size: 1.5em;
        font-weight: 600;
        background: transparent;
        color: #fff;
        border: none;
        resize: none;
        width: 100%;
        padding: 8px 0;
        outline: none;
    }

    .school-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 8px;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>
