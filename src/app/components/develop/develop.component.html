<button class="btn btn-primary" (click)="onRestart()" [disabled]="isLoading">
    Reiniciar
    <span *ngIf="isLoading" style="margin-left:8px;">
        <span class="spinner"
            style="display:inline-block;width:16px;height:16px;border:2px solid #ccc;border-top:2px solid #333;border-radius:50%;animation:spin 0.8s linear infinite;"></span>
    </span>
</button>

<style>
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }
</style>
