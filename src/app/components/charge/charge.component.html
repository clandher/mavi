<form [formGroup]="form">
	<app-form-group title="Monto a cobrar" [control]="form.get('amountToBePaid')">
		<input id="amountToBePaid" type="text" formControlName="amountToBePaid" class="form-control" mask="separator.2"
			[thousandSeparator]="','" [decimalMarker]="'.'" [allowNegativeNumbers]="false" min="0.01">
	</app-form-group>
	<app-form-group title="Concepto" [control]="form.get('concept')">
		<input id="concept" type="text" formControlName="concept" class="form-control">
	</app-form-group>
</form>
