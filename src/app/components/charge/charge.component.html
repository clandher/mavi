<div class="modal-overlay">
  <div class="modal-content">
    <h2 class="text-xl font-semibold mb-4">Nuevo cobro</h2>
    <div class="form-group mt-4">
      <label for="amountToBePaid" class="form-label">Monto a cobrar</label>
      <input id="amountToBePaid" type="number" step="0.01" [(ngModel)]="newCharge.amountToBePaid" class="form-control"
        min="0.01">
    </div>
    <div class="form-group mt-4">
      <label for="concept" class="form-label">Concepto</label>
      <input id="concept" type="text" [(ngModel)]="newCharge.concept" class="form-control">
    </div>
    <div class="flex justify-end space-x-2 mt-4">
      <button (click)="closeModal()" class="btn btn-outline">Cancelar</button>
      <button (click)="saveCharge()" class="btn btn-primary">Guardar</button>
    </div>
  </div>
</div>
