<label class="w-100 cursor-pointer hovered p-2" *ngFor="let nt of notificationTypes">
    <div class=" justify-content-between align-items-center">
        <div class="toggle-row">
            <span class="toggle-label">{{ nt.label }}</span>
            <label class="switch">
                <input type="checkbox" [checked]="notificationPreferences[nt.key]"
                    (change)="onToggle(nt.key)" />
                <span class="slider round"></span>
            </label>
        </div>
    </div>
    <div class="toggle-description">
        {{ nt.description }}
    </div>
</label>

<style>
    .hovered:hover {
        background-color: #1f1f1f;
    }


    .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .toggle-label {
        font-size: 14px;
        font-weight: 500;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 30px;
        height: 16px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #646464;
        transition: .4s;
        border-radius: 24px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 12px;
        width: 12px;
        left: 2px;
        bottom: 2px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked+.slider {
        background-color: #2196F3;
    }

    input:checked+.slider:before {
        transform: translateX(14px);
    }

    .slider.round {
        border-radius: 24px;
    }

    .toggle-description {
        font-size: 12px;
        color: #666;
    }
</style>
