<div class="d-flex flex-column gap-4 text-white mavi-grid">
	<div *ngFor="let item of data"
		class="list-group-item d-flex justify-content-between align-items-center mavi-card">
		<div>
			<p class="mb-1">{{ item.message }}</p>
			<small>Tipo: {{ item.type }} | Procesada: {{ item.processed ? 'Sí' : 'No' }}</small>
		</div>
		<div class="d-flex gap-2 mt-2 justify-content-end">
			<button type="button" class="btn btn-destructive btn-sm" (click)="delete(item.id)">
				<i class="fa fa-trash"></i> Eliminar
			</button>
			<button class="btn btn-info btn-sm" (click)="showRecipients(item.id)">
				<i class="fa fa-users"></i> Ver destinatarios
			</button>
		</div>
	</div>
</div>
<div *ngIf="data.length === 0" class="text-center text-muted py-4">
	No hay notificaciones creadas aún.
</div>
<div class="mavi-bottom-actions">
	<div class="mavi-bottom-actions-inner">
		<button type="button" class="btn btn-secondary" (click)="edit(0, 'Crear notificación')">
			<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
				stroke="currentColor" class="size-4 me-2">
				<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
			</svg>
			Agregar notificación
		</button>
	</div>
</div>
