<div class="d-flex flex-column gap-4 text-white mavi-grid">
	<div *ngFor="let item of data" class=" mavi-card">

		<div class="d-flex justify-content-between align-items-center">

			<div class="d-flex gap-2">
				<span class="badge bg-primary">{{ getTypeDescription(item.type) }}</span>
				<span class="badge bg-secondary">
					<ng-container *ngIf="item.type === 2 && item.category">
						{{ item.category.type }}
					</ng-container>
					<ng-container *ngIf="item.type === 3 && item.activity">
						{{ item.activity.description }}
					</ng-container>
					<ng-container *ngIf="item.type === 4 && item.student">
						{{ item.student.name }}
					</ng-container>
				</span>

			</div>

			<div class="d-flex gap-2">

				<small class="text-muted me-2">
					{{ item.createdAt | date:'short' }}
				</small>

				<ng-container *ngIf="!item.processed">
					<span class="badge bg-warning">
						Pendiente
					</span>
				</ng-container>

				<ng-container *ngIf="item.processed">
					<span *ngIf="item.sent !== null" class="badge bg-success">
						Enviados: {{ item.sent }}
					</span>
					<span *ngIf="(item.failed ?? 0) > 0" class="badge bg-danger">
						Fallidos: {{ item.failed }}
					</span>
				</ng-container>
			</div>
		</div>

		<div>
			<div class="mt-2">
				<small>{{ item.message }}</small>
			</div>
		</div>
		<div class="d-flex gap-2 justify-content-end">
			<button type="button" class="btn btn-destructive btn-sm" (click)="delete(item.id)">
				<i class="fa fa-trash"></i> Eliminar
			</button>
			<button class="btn btn-secondary btn-sm" (click)="showRecipients(item.id)" [disabled]="item.type === 4">
				<i class="fa fa-users"></i> Ver destinatarios
			</button>
		</div>
	</div>
</div>
<div *ngIf="data.length === 0" class="text-center text-muted py-4">
	No hay notificaciones creadas aún.
</div>
<div class="mavi-bottom-actions">
	<div class="mavi-bottom-actions-inner">
		<button type="button" class="btn btn-secondary" (click)="edit(0, 'Crear notificación')">
			<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
				stroke="currentColor" class="size-4 me-2">
				<path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
			</svg>
			Agregar notificación
		</button>
	</div>
</div>
