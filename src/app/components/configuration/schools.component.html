<div [formGroup]="schoolsForm">
    <div formArrayName="schools">
        <div *ngFor="let school of schoolsArray.controls; let i = index" [formGroupName]="i" class="school-card">
            <div class="school-header">
                <label for="logo{{i}}" class="logo-label">
                    <img *ngIf="school.value.logoUrl; else logoPlaceholder" [src]="school.value.logoUrl"
                        class="school-logo-large" alt="Logo">
                    <ng-template #logoPlaceholder>
                        <div class="logo-placeholder logo-placeholder-large">+</div>
                    </ng-template>
                    <input id="logo{{i}}" type="file" accept="image/*" (change)="onLogoSelected($event, i)" hidden>
                </label>
                <div class="school-name">
                    <app-form-group class="flex-2" title="Nombre de la escuela" [control]="school.get('description')"
                        name="description">
                        <input id="description{{i}}" class="form-control school-name-input"
                            formControlName="description">
                    </app-form-group>
                </div>
            </div>
        </div>
    </div>

    <app-submit [form]="schoolsForm" [submit]="saveSchools.bind(this)" [isModal]="false" (discard)="onDiscard()" />
</div>
