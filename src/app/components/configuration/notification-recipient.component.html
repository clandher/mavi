<div class="d-flex flex-column gap-4 text-white mavi-grid">
	<div *ngFor="let item of data" class=" mavi-card">


		@if (item.notification) {
		<div class="d-flex justify-content-between align-items-center">

			<div class="d-flex gap-2">
				<span class="badge bg-primary">{{ getTypeDescription(item.notification.type) }}</span>
				<span class="badge bg-secondary">
					<!-- CATEGORY -->
					<ng-container *ngIf="item.notification?.type === 2 && item.notification?.category">
						{{ item.notification.category.type }}
					</ng-container>

					<!-- ACTIVITY  || INSCRIPTION || AUTOMATIC_INSCRIPTION || MANUAL_CHARGE || UNSUBSCRIBE-->
					<ng-container
						*ngIf="(item.notification?.type === 3  || item.notification?.type === 5 || item.notification?.type === 6 || item.notification?.type === 8 || item.notification?.type === 9  || item.notification?.type ===11 )  && item.notification?.activity">
						{{ item.notification.activity?.description }}
					</ng-container>

				</span>

			</div>

			<div class="d-flex gap-2">

				<small class="text-muted me-2">
					{{ item.sentAt| date:'short' }}
				</small>

				<!-- <ng-container *ngIf="item.status === 0">
					<span class="badge bg-warning">
						Error
					</span>
				</ng-container>

				<ng-container *ngIf="item.status === 1">
					<span class="badge bg-success">
						Enviada
					</span>
				</ng-container> -->
			</div>
		</div>

		<div>
			<div class="mt-2">
				<small>{{ item.notification?.message }}</small>
			</div>
		</div>
		<div class="d-flex gap-2 justify-content-end">
			<button type="button" class="btn btn-destructive btn-sm" (click)="delete(item.id)">
				<i class="fa fa-trash"></i> Eliminar
			</button>
		</div>
		}

	</div>
</div>
<div *ngIf="data.length === 0" class="text-center text-muted py-4">
	No hay notificaciones recibidas aún.
</div>
