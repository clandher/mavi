<form [formGroup]="form">
    <app-form-group [title]="'Nombre del usuario'" [control]="form.get('name')" class="form-group">
        <input id="name" type="text" formControlName="name" class="form-control" [readonly]="false" autocomplete="off">
    </app-form-group>
    <app-form-group [title]="'Teléfono'" [control]="form.get('phone')" class="form-group">
        <input id="phone" type="text" formControlName="phone" class="form-control" [readonly]="false" autocomplete="off">
    </app-form-group>
    <app-form-group [title]="'Activo'" [control]="form.get('active')" class="form-group">
        <input id="active" type="checkbox" formControlName="active">
    </app-form-group>
</form>
