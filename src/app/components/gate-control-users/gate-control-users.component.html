<div class="mavi-grid">
    <div *ngFor="let user of users; let i = index" class="mavi-card">
        <div class="d-flex justify-content-between items-center mb-2">
            {{ user.name }}
        </div>
        <div class="d-flex justify-content-between">
            <div class="detail-row">
                <div class="detail-label">Teléfono</div>
                <div class="detail-value">{{ user.phone }}</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Activo</div>
                <div class="detail-value">{{ user.active ? 'Sí' : 'No' }}</div>
            </div>
        </div>
        <div class="mavi-card-actions mt-4">
            <button class="btn btn-sm btn-outline" (click)="showModal(user.id, 'Editar usuario')">
                Editar
            </button>
            <button class="btn btn-sm btn-destructive" (click)="deleteUser(user.id, i)">
                Eliminar
            </button>
        </div>
    </div>
</div>
<div *ngIf="users.length === 0" class="text-gray-500 text-center py-8">
    No hay usuarios disponibles.
</div>
<div class="mavi-bottom-actions">
    <div class="mavi-bottom-actions-inner">
        <button class="btn btn-secondary" (click)="showModal('0', 'Nuevo usuario')">
            Nuevo usuario
        </button>
    </div>
</div>
