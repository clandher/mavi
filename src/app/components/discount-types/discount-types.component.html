<div class="mavi-grid">
    <div *ngFor="let discountType of discountTypes" class="mavi-card">
        <div class="d-flex justify-content-between items-center mb-2">
            <strong>{{ discountType.key }}</strong>
        </div>

        <div class="d-flex justify-content-between">
            <div class="detail-row">
                <div class="detail-label">Tipo</div>
                <div class="detail-value">
                    {{ discountType.type === 'percentage' ? 'Porcentaje' : 'Monto' }}
                </div>
            </div>

            <div class="detail-row">
                <div class="detail-label">Valor</div>
                <div class="detail-value">
                    <ng-container *ngIf="discountType.type === 'percentage'">
                        {{ discountType.value }}%
                    </ng-container>
                    <ng-container *ngIf="discountType.type === 'amount'">
                        {{ discountType.value | currencyMX }}
                    </ng-container>
                </div>
            </div>
        </div>

        <div class="mavi-card-actions mt-4">
            <button class="btn btn-sm btn-outline" (click)="showModal(discountType.id, 'Editar tipo de descuento')">
                Editar
            </button>
            <button class="btn btn-sm btn-destructive" (click)="deleteDiscountType(discountType.id)">
                Eliminar
            </button>
        </div>
    </div>
</div>

<div *ngIf="discountTypes.length === 0" class="text-gray-500 text-center py-8">
    No hay tipos de descuento disponibles.
</div>

<div class="mavi-bottom-actions">
    <div class="mavi-bottom-actions-inner">
        <button class="btn btn-secondary" (click)="showModal(0, 'Nuevo tipo de descuento')">
            Nuevo tipo de descuento
        </button>
    </div>
</div>
