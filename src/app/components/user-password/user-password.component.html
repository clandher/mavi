<div class="modal-overlay">
    <div class="modal-content">
        <h2 class="text-xl font-semibold mb-4">Cambiar contraseña</h2>
        <form [formGroup]="passwordForm">
            <app-form-group title="Nueva Contraseña" for="password" [control]="passwordForm.get('password')">
                <div class="input-container">
                    <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                        placeholder="••••••••" class="form-control">
                    <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </app-form-group>

        </form>
        <br>
        <app-submit [form]="passwordForm" [submit]="savePassword.bind(this)" (discard)="closeModal()"></app-submit>
    </div>
</div>
