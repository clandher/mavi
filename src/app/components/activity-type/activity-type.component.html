<form [formGroup]="form">
    <app-form-group [title]="'Descripción'" [control]="form.get('key')">
        <input id="key" type="text" formControlName="key" class="form-control" autocomplete="off" />
    </app-form-group>

    <app-form-group [title]="'Recurrente'" [control]="form.get('recurrent')">
        <input id="recurrent" type="checkbox" formControlName="recurrent">
    </app-form-group>

    <app-form-group *ngIf="form.get('recurrent')?.value" [title]="'Periodicidad'"
        [control]="form.get('rule')">
        <input id="rule" type="text" formControlName="rule" class="form-control" [readonly]="false" autocomplete="off">
    </app-form-group>

    <app-form-group [title]="'Formato'" [control]="form.get('format')">
        <input id="format" type="text" formControlName="format" class="form-control" autocomplete="off" />
    </app-form-group>
</form>
