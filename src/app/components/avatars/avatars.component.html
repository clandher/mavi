<div class="w-full max-w-md">
  <label for="categories" class="block text-sm font-bold text-gray-900 dark:text-gray-100 mb-1">
    Categoría:
  </label>
  <select id="categories" name="categories" [(ngModel)]="selectedCategoryId" (change)="onCategoryChange()"
    class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-2 border-gray-800 dark:border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md shadow-sm bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100">
    <option [value]="null" disabled class="text-gray-500 dark:text-gray-400">-- Selecciona una categoría --</option>
    <option *ngFor="let category of categories" [value]="category.id" class="text-gray-900 dark:text-gray-100">
      {{ category.type }}
    </option>
  </select>
</div>
<br>

<div class=" w-full  h-lvh overflow-y-auto">

  <div class="relative w-full overflow-x-auto scrollbar-none pb-3">
    <div class="flex space-x-3 px-2 py-2 bg-gray-100 shadow-md overflow-x-auto scrollbar-none relative">
      <div class="" [style.width.px]="highlightWidth">
      </div>
      <button *ngFor="let activity of activities; let i = index" (click)="onActivityChange(activity.id, i)" #btn class="relative z-10 px-6 py-2 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap 
               hover:text-blue-600 hover:scale-105" [ngClass]="{
          'text-blue-600': selectedActivityId === activity.id,
          'text-gray-600': selectedActivityId !== activity.id
        }">
        {{ activity.description }}
      </button>

      <button (click)="openNewEventModal()" class="relative z-10 px-6 py-2 rounded-xl text-sm font-medium transition-all duration-300 whitespace-nowrap 
      hover:text-blue-600 hover:scale-105 text-gray-600">
        Nueva actividad
      </button>
    </div>
  </div>



  <div class="relative justify-center ">
    <div *ngFor="let activity of activities">
      <div *ngIf="selectedActivityId === activity.id" class="grid grid-cols-6 gap-4">

        <!-- Botón para agregar nuevo avatar -->
        <div class="relative">
          <div (click)="addNewAvatar()"
            class="w-25 h-25 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden cursor-pointer transition-all duration-300 hover:bg-gray-300">
            <span class="text-3xl font-bold text-gray-600">+</span>
          </div>
        </div>

        <!-- Avatares -->
        <div *ngFor="let studentActivity of studentActivities" class="relative">
          <div (click)="selectAvatar(studentActivity)" [ngClass]="{
                'border-4 border-blue-500 shadow-lg': selectedStudentActivity === studentActivity
              }"
            class="w-25 h-25 rounded-full bg-gray-300 flex items-center justify-center overflow-hidden cursor-pointer transition-all duration-300">
            <img [src]="'https://i.pravatar.cc/150?img=' + studentActivity.id % 70" alt="Avatar"
              class="w-full h-full object-cover" />
          </div>

          <div *ngIf="selectedStudentActivity === studentActivity"
            class="absolute z-30 mt-2 w-48 bg-white rounded-lg shadow-xl">
            <ul class="py-2">
              <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="openEditModal(studentActivity)">
                Editar
              </li>
              <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="showPaymentModal = true">Registrar pago</li>
              <!-- <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="toggleSubmenu('registrarPagoEn')">
                Registrar pago en...
                <ul *ngIf="showSubmenu['registrarPagoEn']" class="pl-4">
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="openPaymentModal()">Entrenamiento
                    (Abril)</li>
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="openPaymentModal()">Entrenamiento
                    (Mayo)</li>
                </ul>
              </li> -->
              <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="toggleSubmenu('inscribir')">
                Inscribir a...
                <ul *ngIf="showSubmenu['inscribir']" class="pl-4">
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Liga X</li>
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Torneo X</li>
                </ul>
              </li>

              <!-- <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer" (click)="toggleSubmenu('Observaciones')">
                Observaciones...
                <ul *ngIf="showSubmenu['Observaciones']" class="pl-4">
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Control del baló</li>
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Regate</li>
                  <li class="px-4 py-2 hover:bg-gray-100 cursor-pointer">Cabeceo</li>
                </ul>
              </li> -->
            </ul>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Modal de registrar pago -->


  <div *ngIf="showPaymentModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <app-payment [studentId]="selectedStudentActivity?.student?.id!" (complete)="onPaymentComplete($event)">
    </app-payment>
  </div>

  <div *ngIf="showModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl min-w-[40vw] max-h-[80vh] overflow-y-auto">
      <h2 class="text-xl font-semibold mb-4">
        {{ mode === 'update' ? 'Actualizar a ' + selectedStudentActivity!.student.name : 'Agregar alumno' }}
      </h2>

      <!-- Categoria: {{this.selectedCategory?.type}} <br>
      Actividad: {{this.selectedActivity?.description}} -->


      <div class="form-group">
        <label for="name">Categoria:</label>
        <select [(ngModel)]="newCategoryId" name="newCategory" class="category-select" (change)="onNewCategoryChange()">
          <option *ngFor="let cat of categories" [value]="cat.id">
            {{ cat.type }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="name">Actividad:</label>
        <select [(ngModel)]="newActivityId" name="newAcitivity" class="category-select">
          <option *ngFor="let act of newActivities" [value]="act.id">
            {{ act.description }}
          </option>
        </select>
      </div>






      <!-- Tabs -->
      <div class="flex border-b mb-4">
        <button (click)="activeTab = 'existing'"
          [class]="activeTab === 'existing' ? 'border-b-2 border-blue-500 font-medium' : 'text-gray-500'"
          class="px-4 py-2 focus:outline-none">
          Seleccionar existente
        </button>
        <button (click)="activeTab = 'new'"
          [class]="activeTab === 'new' ? 'border-b-2 border-blue-500 font-medium' : 'text-gray-500'"
          class="px-4 py-2 focus:outline-none">
          Crear nuevo
        </button>
      </div>

      <!-- Contenido de los tabs -->
      <div *ngIf="activeTab === 'existing'">
        <!-- Tab de estudiantes existentes -->
        <div class="mb-4">
          <label class="block mb-2">Buscar estudiante</label>
          <input type="text" [(ngModel)]="searchTerm" (input)="filterStudents()" placeholder="Buscar por nombre..."
            class="w-full p-2 border rounded-lg mb-3">
        </div>

        <div class="grid grid-cols-3 gap-3 mb-4 max-h-60 overflow-y-scroll">
          <div *ngFor="let student of filteredStudents" (click)="selectStudent(student)"
            [class.bg-blue-500]="selectedExistingStudent?.id === student.id"
            class="p-3 border cursor-pointer hover:font-bold flex flex-col justify-between items-center">
            <span>{{ student.name }}</span>
            <span class="text-sm text-gray-500">Edad {{ getAge(student.birthdate) }}</span>
          </div>
          <div *ngIf="filteredStudents.length === 0" class="col-span-3 text-center py-4 text-gray-500">
            No se encontraron estudiantes
          </div>
        </div>
      </div>

      <div *ngIf="activeTab === 'new'">
        <!-- Tab para crear nuevo estudiante -->
        <div class="mb-4">
          <label class="block mb-2">Nombre</label>
          <input type="text" [(ngModel)]="newStudent.name" class="w-full p-2 border rounded-lg mb-3"
            placeholder="Nombre completo del estudiante">
        </div>

        <div class="mb-4">
          <label class="block mb-2">Fecha de nacimiento</label>
          <input type="date" [max]="getFormattedDate(maxBirthdate)" [(ngModel)]="newStudent.birthdate"
            class="w-full p-2 border rounded-lg mb-3">
        </div>
      </div>

      <div class="flex justify-end space-x-2 mt-4">
        <button (click)="closeModal()" class="bg-gray-400 px-4 py-2 rounded-lg text-white">Cancelar</button>
        <button (click)="saveChanges()"
          [disabled]="(activeTab === 'existing' && !selectedExistingStudent) || (activeTab === 'new' && !newStudent.name)"
          class="bg-blue-500 px-4 py-2 rounded-lg text-white disabled:bg-blue-300">
          {{ activeTab === 'existing' ? 'Seleccionar' : 'Crear y agregar' }}
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de agregar nuevo evento -->
  <!-- Modal HTML actualizado -->
  <div *ngIf="newEventModalVisible" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-96">
      <h2 class="text-xl font-semibold mb-4">Nueva actividad</h2>

      <label class="block mb-2">Descripción</label>
      <input type="text" [(ngModel)]="newActivity.description" class="w-full p-2 border rounded-lg mb-3">

      <label class="block mb-2">Categoría</label>
      <select [(ngModel)]="newActivity.categoryId" class="w-full p-2 border rounded-lg mb-3">
        <option *ngFor="let category of categories" [value]="category.id">{{ category.type }}</option>
      </select>

      <label class="block mb-2">Tipo de Actividad</label>
      <select [(ngModel)]="newActivity.typeId" class="w-full p-2 border rounded-lg mb-3">
        <option *ngFor="let type of activityTypes" [value]="type.id">{{ type.key }}</option>
      </select>

      <label class="block mb-2">Fecha de Inicio</label>
      <input type="datetime-local" [(ngModel)]="newActivity.startDate" class="w-full p-2 border rounded-lg mb-3">

      <label class="block mb-2">Fecha de Fin</label>
      <input type="datetime-local" [(ngModel)]="newActivity.endDate" class="w-full p-2 border rounded-lg mb-3">

      <label class="block mb-2">Período de gracia (días)</label>
      <input type="number" [(ngModel)]="newActivity.gracePeriod" class="w-full p-2 border rounded-lg mb-3">

      <label class="block mb-2">Precio</label>
      <input type="number" step="0.01" [(ngModel)]="newActivity.price" class="w-full p-2 border rounded-lg mb-3">

      <div class="flex justify-end space-x-2 mt-4">
        <button (click)="closeNewEventModal()" class="bg-gray-400 px-4 py-2 rounded-lg text-white">Cancelar</button>
        <button (click)="saveNewActivity()" class="bg-blue-500 px-4 py-2 rounded-lg text-white">Guardar</button>
      </div>
    </div>
  </div>
