<div *ngIf="showUserModal">
    <app-user [userId]="userId" (complete)="loadUsers()"></app-user>
</div>

<div class="mavi-grid">
    <div *ngFor="let user of users; let i = index" class="mavi-card">
        <div class="d-flex justify-content-between items-center mb-2">
            {{ user.name }}
        </div>

        <div class="d-flex justify-content-between">
            <div class="detail-row">
                <div class="detail-label">Email</div>
                <div class="detail-value">
                    {{ user.email }}
                </div>
            </div>

            <div class="detail-row">
                <div class="detail-label">Desarrollador</div>
                <div class="detail-value">
                    {{ user.developer ? 'Sí' : 'No' }}
                </div>
            </div>
        </div>

        <div class="card-actions mt-4 d-flex flex-wrap gap-2">

            <button class="btn btn-sm btn-outline flex-grow-1" (click)="editUser(user.id)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="me-2" style="width: 1rem; height: 1rem;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.862 3.487a2.25 2.25 0 0 1 3.182 3.182L7.127 19.586a4.5 4.5 0 0 1-1.591 1.06l-3.386 1.268 1.268-3.386a4.5 4.5 0 0 1 1.06-1.591L16.862 3.487z" />
                </svg>
                Editar
            </button>
            <button class="btn btn-sm btn-destructive flex-grow-1" (click)="deleteUser(user.id)" [disabled]="user.lock"
                [title]="user.lock ? 'Este usuario no se puede eliminar porque es el usuario administrador.' : ''">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="me-2" style="width: 1rem; height: 1rem;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9.75 9.75 14.25 14.25M14.25 9.75 9.75 14.25M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
                </svg>
                Eliminar
            </button>

            <button class="btn btn-sm btn-outline flex-grow-1" (click)="openPasswordModal(user.id)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="me-2" style="width: 1rem; height: 1rem;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                </svg>
                Cambiar contraseña
            </button>
        </div>
    </div>
</div>

<div *ngIf="users.length === 0" class="text-gray-500 text-center py-8">
    No hay usuarios disponibles.
</div>

<div class="mavi-bottom-actions">
    <div class="mavi-bottom-actions-inner">
        <button class="btn btn-secondary" (click)="onNewUser()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="size-4 me-2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            Nuevo usuario
        </button>
    </div>
</div>

<div *ngIf="showPasswordModal">
    <app-user-password [userId]="userId" (complete)="onPasswordModalComplete($event)"></app-user-password>
</div>
