<form [formGroup]="form">
	<app-form-group [title]="'Descripción'" [control]="form.get('description')" class="form-group">
		<input id="description" type="text" formControlName="description" class="form-control" [readonly]="false">
	</app-form-group>
	<div class="d-flex gap-4 justify-content-between">
		<app-form-group [title]="'Categoría'" [control]="form.get('categoryId')" class="flex-grow-1">
			<select id="newActivityCategoryId" formControlName="categoryId" class="form-control">
				<option *ngFor="let category of categories" [value]="category.id">{{ category.type }}</option>
			</select>
		</app-form-group>
		<app-form-group [title]="'Tipo de Actividad'" [control]="form.get('typeId')" class="flex-grow-1">
			<select id="newActivityTypeId" formControlName="typeId" class="form-control">
				<option *ngFor="let type of activityTypes" [value]="type.id">{{ type.key }}</option>
			</select>
		</app-form-group>
	</div>
	<div class="d-flex gap-4 justify-content-between">
		<app-form-group [title]="'Fecha de Inicio'" [control]="form.get('startDate')" class="flex-grow-1">
			<input id="newActivityStartDate" type="datetime-local" formControlName="startDate" class="form-control"
				[min]="todayDatetimeLocal">
		</app-form-group>
		<app-form-group [title]="'Fecha de Fin'" [control]="form.get('endDate')" class="flex-grow-1">
			<input id="newActivityEndDate" type="datetime-local" formControlName="endDate" class="form-control"
				[min]="form.get('startDate')?.value">
		</app-form-group>
	</div>
	<div class="d-flex gap-4 justify-content-between">
		<app-form-group [title]="'Período de gracia (días)'" [control]="form.get('gracePeriod')" class="flex-grow-1">
			<input id="newActivityGracePeriod" type="text" formControlName="gracePeriod" class="form-control" mask="0*"
				[allowNegativeNumbers]="false" />
		</app-form-group>
		<app-form-group [title]="'Precio'" [control]="form.get('price')" class="flex-grow-1">
			<input id="newActivityPrice" type="text" formControlName="price" class="form-control" positiveNumberOnly
				mask="separator.2" [thousandSeparator]="','" [decimalMarker]="'.'" [allowNegativeNumbers]="false" />
		</app-form-group>
	</div>
</form>
